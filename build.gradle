plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

repositories {
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

loom {
    // VoidBoost is client-only; keep its Java sources in the main source set
    // so Minecraft client classes are available during compilation.
    mods {
        voidboost {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

jar {
    inputs.property 'archivesName', project.archives_base_name
    from('LICENSE') { rename { "${it}_${project.archives_base_name}" } }
}

tasks.register("prodClient", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    useXVFB = true
    mods.from remapJar
}

publishing {
    publications {
        create('mavenJava', MavenPublication) { from components.java }
    }
}
