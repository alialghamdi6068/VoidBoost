name: Build VoidBoost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build production JAR
        run: gradle build --no-daemon --stacktrace

      - name: Verify production JAR
        shell: bash
        run: |
          set -euo pipefail
          jars=(build/libs/*.jar)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No JAR was produced."
            exit 1
          fi
          production=""
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-dev.jar|*-sources.jar) ;;
              *) production="$jar"; break ;;
            esac
          done
          if [ -z "$production" ]; then
            echo "No production JAR was found."
            exit 1
          fi

          echo "Production JAR: $production"
          unzip -l "$production" | grep -F "fabric.mod.json"
          unzip -l "$production" | grep -F "voidboost.mixins.json"
          unzip -l "$production" | grep -F "com/voidboost/client/VoidBoostClient.class"

          icon_path="assets/voidboost/icon.png"
          if ! unzip -l "$production" | grep -Fq "$icon_path"; then
            echo "Production JAR is missing $icon_path"
            exit 1
          fi

          python - "$production" <<'PY'
          import struct
          import sys
          import zipfile

          jar = sys.argv[1]
          icon_path = "assets/voidboost/icon.png"

          with zipfile.ZipFile(jar) as archive:
              data = archive.read(icon_path)

          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("Mod icon is not a valid PNG file.")

          if len(data) < 24:
              raise SystemExit("Mod icon PNG is truncated.")

          width, height = struct.unpack(">II", data[16:24])
          print(f"Mod icon: {width}x{height}")

          if width != height:
              raise SystemExit("Mod icon must be square.")

          if width == 0 or (width & (width - 1)) != 0:
              raise SystemExit("Mod icon dimensions must be a power of two.")

          print("Mod icon is valid, square, and packaged in the production JAR.")
          PY

      - name: Production client smoke test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 90s gradle prodClient --no-daemon --stacktrace 2>&1 | tee production-client.log
          status=${PIPESTATUS[0]}
          set -e

          # Minecraft is a long-running client, so a timeout is expected after
          # successful startup. Fail only when an actual fatal startup error
          # occurred or the startup checkpoint was never reached.
          if grep -Eq 'FATAL|Mixin apply failed|InvalidInjectionException|NoSuchMethodError|NoClassDefFoundError|Exception in thread "main"' production-client.log; then
            echo "Production client reported a fatal startup error."
            exit 1
          fi

          if grep -Fq 'Reloading ResourceManager:' production-client.log; then
            echo "Production client reached resource loading successfully."
            exit 0
          fi

          if [ "$status" -eq 124 ]; then
            echo "Production client timed out before the startup checkpoint."
          else
            echo "Production client exited before the startup checkpoint (status $status)."
          fi
          exit 1

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoidBoost-production-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
