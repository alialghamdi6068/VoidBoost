name: Build VoidBoost

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'

      - name: Build production JAR
        run: gradle build --no-daemon --stacktrace

      - name: Verify production JAR
        shell: bash
        run: |
          set -euo pipefail
          jars=(build/libs/*.jar)
          if [ "${#jars[@]}" -eq 0 ]; then
            echo "No JAR was produced."
            exit 1
          fi
          production=""
          for jar in "${jars[@]}"; do
            case "$jar" in
              *-dev.jar|*-sources.jar) ;;
              *) production="$jar"; break ;;
            esac
          done
          if [ -z "$production" ]; then
            echo "No production JAR was found."
            exit 1
          fi
          echo "Production JAR: $production"
          unzip -l "$production" | grep -F "fabric.mod.json"
          unzip -l "$production" | grep -F "voidboost.mixins.json"
          unzip -l "$production" | grep -F "com/voidboost/client/VoidBoostClient.class"

      - name: Production client smoke test
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s gradle prodClient --no-daemon --stacktrace

      - name: Upload production JAR
        uses: actions/upload-artifact@v4
        with:
          name: VoidBoost-production-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
